<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Share card source</title>

  <!--
    Source for the share image (assets/og/og-image.png), the picture shown when
    the site link is posted on LinkedIn, Slack, iMessage and so on.
    It reuses the site's own stylesheet and cover-art script, so the card always
    matches the cover. This file is not published.

    Render it from the 416lj folder with:

      ../.venv/bin/python ../execution/render_html_to_png.py \
          sources/brand/share-card.html assets/og/og-image.png \
          --size 1200x630 --reduced-motion --settle 12000
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,700..900&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400..800&family=M+PLUS+1+Code:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&text=%E7%AC%AC%E4%B8%80%E5%B7%BB%E6%96%B0%E7%AB%A0%E9%96%8B%E5%B9%95%E6%A9%9F%E6%A2%B0%E5%AD%A6%E7%BF%92%E3%81%A8%E3%80%81%E3%81%9D%E3%82%8C%E3%82%92%E5%8B%95%E3%81%8B%E3%81%99%E5%9F%BA%E7%9B%A4%E3%80%82&display=swap">
  <link rel="stylesheet" href="../../css/main.css">

  <style>
    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    /* No paper grain here: it bloats the PNG and adds nothing at card size. */
    body::after {
      display: none;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 34px 50px 42px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 398px;
      grid-template-rows: auto minmax(0, 1fr);
      column-gap: 38px;
      row-gap: 20px;
    }

    .card .cover__mast {
      grid-column: 1 / -1;
      font-size: 13px;
    }

    /* No z-index: the name blends with the print beside it (see .cover__lead). */
    .card__lead {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .card .cover__title {
      --name-size: 196px;
    }

    .card .cover__role {
      font-size: 13px;
    }

    .card .cover__role span:first-child {
      font-size: 15px;
    }

    .card .cover__lede {
      max-width: 610px;
      font-size: 25px;
      line-height: 1.3;
    }

    .card__url {
      margin-top: 14px;
      font: 600 14px/1 var(--ff-mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .card .cover__art {
      grid-column: 2;
      grid-row: 2;
      min-height: 0;
    }

    /* On the site the frame sits on a data plate. Here it stands alone. */
    .card .art__frame {
      border-bottom-width: var(--line);
    }

    /* The card is a fixed size, so the site's rules for tall and low windows
       are switched off here: the frame fills its column, and the sticker and
       the vertical line stay. */
    .card .art {
      min-height: 0;
      max-height: none;
    }

    .card .burst {
      display: grid;
      left: -46px;
      bottom: 14px;
      width: 112px;
    }

    .card .cover__tategaki {
      display: block;
    }
  </style>

  <script>
    document.documentElement.classList.add('js');
  </script>
</head>

<body>
  <div class="card">
    <p class="cover__mast">
      <span>Vol. 01</span>
      <span lang="ja" class="cover__mast-jp">第一巻</span>
      <span>2026 edition</span>
      <span class="cover__mast-end">Toronto, Canada</span>
    </p>

    <div class="card__lead">
      <div class="cover__title">
        <p class="cover__name">
          <span class="cover__name-line">Laxsan</span>
          <span class="cover__name-line">Jeya</span>
        </p>
        <p class="cover__role">
          <span>Software engineer</span>
          <span>ML, AI and infrastructure</span>
        </p>
      </div>

      <div>
        <p class="cover__lede">I build machine-learning systems, and the pipelines and infrastructure that keep them running in production.</p>
        <p class="card__url">416lj.github.io</p>
      </div>
    </div>

    <figure class="cover__art" data-cover-art
            data-portrait-ink="../../assets/img/portrait-ink.png"
            data-portrait-figure="../../assets/img/portrait-figure.png">
      <div class="art">
        <div class="panel art__frame">
          <canvas class="art__canvas"></canvas>
        </div>
        <span class="crop crop--tl"></span>
        <span class="crop crop--tr"></span>
        <span class="crop crop--bl"></span>
        <span class="crop crop--br"></span>
        <p class="burst"><span lang="ja">新章開幕</span><span>New chapter</span></p>
        <p class="cover__tategaki" lang="ja">機械学習と、それを動かす基盤。</p>
      </div>
    </figure>
  </div>

  <script src="../../js/main.js"></script>
  <script src="../../js/portrait-data.js"></script>
  <script src="../../js/cover-art.js"></script>
</body>
</html>
